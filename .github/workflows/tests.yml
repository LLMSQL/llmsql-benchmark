name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    # `pre-commit run --all-files` is not enforced anywhere, so `ruff check llmsql`
    # has been failing on main. Run the same ruff version as .pre-commit-config.yaml
    # (v0.8.4) on every supported interpreter: the lint rules include `UP`
    # (pyupgrade), whose findings depend on the target Python version.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install "ruff==0.8.4"

      - name: Lint
        run: ruff check llmsql

      - name: Check formatting
        run: ruff format --check llmsql

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDM
        run: pip install pdm

      - name: Cache PDM packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdm
          key: ${{ runner.os }}-pdm-${{ hashFiles('pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pdm-

      - name: Install dependencies (with dev)
        run: pdm install --with dev,vllm

      - name: Run tests with coverage
        run: PYTHONPATH=. pdm run pytest --cov=llmsql --cov-report=xml --maxfail=1 --disable-warnings -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  test-cpu-only:
    # Guards against the test suite requiring the optional `vllm` extra to be
    # importable: `dev` alone must be enough to collect and run every CPU test.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDM
        run: pip install pdm

      - name: Cache PDM packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdm
          key: ${{ runner.os }}-pdm-${{ hashFiles('pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pdm-

      - name: Install dependencies (dev only, no vllm)
        run: pdm install --with dev

      - name: Run CPU-only tests
        run: PYTHONPATH=. pdm run pytest -m "not gpu" --maxfail=1 --disable-warnings -v
